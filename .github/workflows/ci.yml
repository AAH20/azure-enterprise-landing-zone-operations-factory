name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Bicep CLI
        run: az bicep install --version v0.46.1
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - run: az bicep build --file infra/subscription/governance.bicep --stdout > /dev/null
      - run: python -m unittest discover -s tests -v
